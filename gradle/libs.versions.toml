[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
room = "2.6.1"
workManager = "2.10.0"
coil = "3.0.4"
media3 = "1.5.1"
biometric = "1.2.0-alpha05"
junit = "4.13.2"
